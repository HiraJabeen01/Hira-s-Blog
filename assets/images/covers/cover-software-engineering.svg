<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="seBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <radialGradient id="seGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="seCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#seBgGrad)"/>
  <rect width="1200" height="675" fill="url(#seGlow)"/>

  <!-- Matrix Blueprint Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675"/>
    <line x1="220" y1="0" x2="220" y2="675"/>
    <line x1="360" y1="0" x2="360" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="640" y1="0" x2="640" y2="675"/>
    <line x1="780" y1="0" x2="780" y2="675"/>
    <line x1="920" y1="0" x2="920" y2="675"/>
    <line x1="1060" y1="0" x2="1060" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Code / IDE Window Representation -->
  <g transform="translate(140, 130)">
    <rect width="520" height="415" rx="16" fill="url(#seCardGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Window Header -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L504 0 C512.84 0 520 7.16 520 16 L520 44 L0 44 Z" fill="#0F172A" fill-opacity="0.9"/>
    <circle cx="28" cy="22" r="6" fill="#EF4444"/>
    <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="22" r="6" fill="#10B981"/>
    <text x="260" y="27" fill="#64748B" font-family="monospace" font-size="12" text-anchor="middle">architecture_service.ts</text>

    <!-- Syntax Highlighted Code Lines Simulation -->
    <g transform="translate(32, 70)">
      <!-- Line 1: export class CoreSystem -->
      <rect x="0" y="0" width="85" height="12" rx="4" fill="#F43F5E"/>
      <rect x="95" y="0" width="140" height="12" rx="4" fill="#38BDF8"/>
      <rect x="245" y="0" width="30" height="12" rx="4" fill="#E2E8F0" fill-opacity="0.4"/>

      <!-- Line 2: constructor -->
      <rect x="24" y="28" width="110" height="10" rx="4" fill="#A855F7"/>
      <rect x="142" y="28" width="180" height="10" rx="4" fill="#94A3B8"/>

      <!-- Line 3: async processQueue -->
      <rect x="24" y="56" width="60" height="10" rx="4" fill="#38BDF8"/>
      <rect x="92" y="56" width="130" height="10" rx="4" fill="#FBBF24"/>
      <rect x="230" y="56" width="80" height="10" rx="4" fill="#34D399"/>

      <!-- Line 4: try catch -->
      <rect x="48" y="84" width="45" height="10" rx="4" fill="#F43F5E"/>
      <rect x="102" y="84" width="220" height="10" rx="4" fill="#E2E8F0" fill-opacity="0.5"/>

      <!-- Line 5: dispatch event -->
      <rect x="72" y="112" width="160" height="10" rx="4" fill="#38BDF8"/>
      <rect x="240" y="112" width="110" height="10" rx="4" fill="#A78BFA"/>

      <!-- Line 6: metric record -->
      <rect x="72" y="140" width="190" height="10" rx="4" fill="#10B981"/>

      <!-- Line 7: resilient fallback -->
      <rect x="48" y="168" width="65" height="10" rx="4" fill="#F43F5E"/>
      <rect x="122" y="168" width="140" height="10" rx="4" fill="#F87171"/>
      <rect x="72" y="196" width="180" height="10" rx="4" fill="#E2E8F0" fill-opacity="0.4"/>

      <!-- Line 8: return status -->
      <rect x="48" y="224" width="60" height="10" rx="4" fill="#F43F5E"/>
      <rect x="116" y="224" width="90" height="10" rx="4" fill="#38BDF8"/>
    </g>
  </g>

  <!-- System Architecture Topology on Right -->
  <g transform="translate(720, 140)">
    <!-- API Gateway Node -->
    <rect x="80" y="20" width="220" height="64" rx="12" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
    <text x="190" y="48" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">API GATEWAY</text>
    <text x="190" y="66" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">REST &bull; gRPC &bull; Events</text>

    <!-- Connector Lines -->
    <path d="M190 84 L190 140 M190 140 L80 170 M190 140 L300 170" stroke="url(#lineGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Microservice Node A -->
    <rect x="0" y="170" width="160" height="60" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.8"/>
    <text x="80" y="198" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Order Engine</text>
    <text x="80" y="215" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">v2.4 &bull; 99.99% SLA</text>

    <!-- Microservice Node B -->
    <rect x="220" y="170" width="160" height="60" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.8"/>
    <text x="300" y="198" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Telemetry &amp; Cache</text>
    <text x="300" y="215" fill="#C7D2FE" font-family="monospace" font-size="10" text-anchor="middle">Redis &bull; OpenTelemetry</text>

    <!-- Connector to Database -->
    <path d="M80 230 L80 290 M300 230 L300 290 M80 290 L190 320 M300 290 L190 320" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

    <!-- Database / Storage Layer -->
    <rect x="90" y="320" width="200" height="64" rx="12" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>
    <text x="190" y="348" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PERSISTENT STORAGE</text>
    <text x="190" y="366" fill="#DDD6FE" font-family="monospace" font-size="10" text-anchor="middle">Distributed SQL &bull; Replicated</text>
  </g>

  <!-- Floating Pill Badges -->
  <g transform="translate(140, 580)">
    <rect width="180" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="90" y="23" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Resilient Architecture</text>
  </g>
  <g transform="translate(340, 580)">
    <rect width="180" height="36" rx="18" fill="#1E293B" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="90" y="23" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pragmatic Design</text>
  </g>
  <g transform="translate(540, 580)">
    <rect width="190" height="36" rx="18" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="95" y="23" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Production Telemetry</text>
  </g>
</svg>
