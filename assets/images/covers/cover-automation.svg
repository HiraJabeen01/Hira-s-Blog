<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="autoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <radialGradient id="autoGlow" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="autoGlowTeal" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#autoBgGrad)"/>
  <rect width="1200" height="675" fill="url(#autoGlow)"/>
  <rect width="1200" height="675" fill="url(#autoGlowTeal)"/>

  <!-- Circuit & Conduit Grid Lines -->
  <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1.5">
    <path d="M0 180 H400 L450 230 H800 L850 180 H1200"/>
    <path d="M0 340 H300 L360 400 H840 L900 340 H1200"/>
    <path d="M0 500 H500 L560 440 H740 L800 500 H1200"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Central Orchestration Flow Pipeline -->
  <!-- Main Conduit Line -->
  <path d="M120 330 C280 330, 320 230, 480 230 H720 C880 230, 920 330, 1080 330" stroke="url(#pipeGrad)" stroke-width="4" stroke-dasharray="8 8" fill="none"/>

  <!-- Pipeline Step 1: Ingestion / Webhook Trigger -->
  <g transform="translate(180, 290)">
    <rect width="180" height="85" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="34" cy="32" r="14" fill="#064E3B"/>
    <!-- Bolt / Trigger Icon -->
    <path d="M34 24 L30 32 L36 32 L32 40" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">EVENT TRIGGER</text>
    <text x="60" y="48" fill="#6EE7B7" font-family="monospace" font-size="10">Webhooks &bull; Realtime</text>
    <rect x="20" y="65" width="140" height="6" rx="3" fill="#1E293B"/>
    <rect x="20" y="65" width="110" height="6" rx="3" fill="#10B981"/>
  </g>

  <!-- Pipeline Step 2: Intelligent Processing & Validation Engine -->
  <g transform="translate(490, 185)">
    <rect width="220" height="95" rx="16" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
    <!-- Gear / Automation Icon -->
    <circle cx="40" cy="38" r="16" fill="#164E63"/>
    <path d="M40 28 V48 M30 38 H50 M33 31 L47 45 M47 31 L33 45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">WORKFLOW ENGINE</text>
    <text x="70" y="52" fill="#7DD3FC" font-family="monospace" font-size="10">Transform &bull; Idempotency</text>
    <!-- Status Indicator -->
    <rect x="24" y="72" width="60" height="14" rx="7" fill="#065F46"/>
    <text x="54" y="82" fill="#A7F3D0" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">ACTIVE 100%</text>
  </g>

  <!-- Pipeline Step 3: Multi-System Sync / Distribution -->
  <g transform="translate(840, 290)">
    <rect width="180" height="85" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="34" cy="32" r="14" fill="#1E3A8A"/>
    <!-- Branch / Sync Icon -->
    <circle cx="30" cy="36" r="3" fill="#60A5FA"/>
    <circle cx="40" cy="28" r="3" fill="#60A5FA"/>
    <circle cx="40" cy="42" r="3" fill="#60A5FA"/>
    <path d="M30 36 L40 28 M30 36 L40 42" stroke="#60A5FA" stroke-width="2"/>
    <text x="60" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SYSTEM DISPATCH</text>
    <text x="60" y="48" fill="#93C5FD" font-family="monospace" font-size="10">CRM &bull; Data &bull; APIs</text>
    <rect x="20" y="65" width="140" height="6" rx="3" fill="#1E293B"/>
    <rect x="20" y="65" width="130" height="6" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Bottom Automation Feedback Loop -->
  <g transform="translate(360, 430)">
    <rect width="480" height="80" rx="16" fill="#0F172A" fill-opacity="0.9" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="45" cy="40" r="18" fill="#064E3B"/>
    <path d="M38 40 L43 45 L52 35" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="78" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Self-Healing &amp; Observability</text>
    <text x="78" y="55" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">Automated error recovery, audit trails, and zero-toil operations</text>
  </g>

  <!-- Floating Tech Tags -->
  <g transform="translate(140, 560)">
    <rect width="180" height="38" rx="19" fill="#0F172A" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="90" y="24" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Event-Driven Pipelines</text>
  </g>
  <g transform="translate(350, 560)">
    <rect width="170" height="38" rx="19" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="85" y="24" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">API Integrations</text>
  </g>
  <g transform="translate(550, 560)">
    <rect width="190" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="95" y="24" fill="#BFDBFE" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Zero-Manual Toil</text>
  </g>
  <g transform="translate(770, 560)">
    <rect width="180" height="38" rx="19" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="90" y="24" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Enterprise Scale</text>
  </g>
</svg>
