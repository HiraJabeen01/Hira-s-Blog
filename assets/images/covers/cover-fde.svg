<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowIndigo" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowIndigo)"/>
  <rect width="1200" height="675" fill="url(#glowCyan)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="250" y1="0" x2="250" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="550" y1="0" x2="550" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="850" y1="0" x2="850" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="0" y1="460" x2="1200" y2="460"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- Interconnection Lines (The Bridge of FDE) -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6">
    <line x1="280" y1="220" x2="600" y2="330"/>
    <line x1="600" y1="330" x2="920" y2="220"/>
    <line x1="600" y1="330" x2="600" y2="520"/>
    <line x1="280" y1="220" x2="920" y2="220"/>
  </g>

  <!-- Central Hub: Forward Deployed Engineer -->
  <g transform="translate(600, 330)">
    <circle r="90" fill="#1E293B" stroke="#818CF8" stroke-width="3" stroke-opacity="0.8"/>
    <circle r="115" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.5"/>
    <circle r="60" fill="url(#nodeGrad1)"/>
    <!-- Terminal / Gear Icon -->
    <path d="M-18 -10 L-6 0 L-18 10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="2" y1="10" x2="18" y2="10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="0" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">FDE CORE</text>
  </g>

  <!-- Node 1: Engineering Hub -->
  <g transform="translate(280, 220)">
    <circle r="65" fill="#0F172A" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7"/>
    <circle r="42" fill="url(#nodeGrad2)"/>
    <!-- Code Bracket Icon -->
    <path d="M-12 -12 L-20 0 L-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M12 -12 L20 0 L12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="4" y1="-14" x2="-4" y2="14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="34" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ENGINEERING</text>
  </g>

  <!-- Node 2: Product & Strategy Hub -->
  <g transform="translate(920, 220)">
    <circle r="65" fill="#0F172A" stroke="#818CF8" stroke-width="2" stroke-opacity="0.7"/>
    <circle r="42" fill="url(#nodeGrad1)"/>
    <!-- Layers / Product Icon -->
    <polygon points="0,-16 18,-6 0,4 -18,-6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M-18 0 L0 10 L18 0" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M-18 6 L0 16 L18 6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="0" y="34" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PRODUCT</text>
  </g>

  <!-- Node 3: Real-World Customer Impact Hub -->
  <g transform="translate(600, 520)">
    <circle r="65" fill="#0F172A" stroke="#34D399" stroke-width="2" stroke-opacity="0.7"/>
    <circle r="42" fill="url(#nodeGrad3)"/>
    <!-- Globe / Real-world Outcome Icon -->
    <circle r="18" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <ellipse rx="9" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="34" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">REAL-WORLD</text>
  </g>

  <!-- Floating Glass Badges -->
  <!-- Top Left Badge -->
  <g transform="translate(120, 80)">
    <rect width="210" height="48" rx="24" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="6" fill="#38BDF8"/>
    <text x="44" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Cross-Disciplinary Impact</text>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(860, 80)">
    <rect width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="6" fill="#818CF8"/>
    <text x="44" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">AI &amp; Systems Integration</text>
  </g>

  <!-- Bottom Left Badge -->
  <g transform="translate(140, 560)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2"/>
    <text x="90" y="26" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Discovery &rarr; Production</text>
  </g>

  <!-- Bottom Right Badge -->
  <g transform="translate(880, 560)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2"/>
    <text x="90" y="26" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Customer Empathy</text>
  </g>
</svg>
