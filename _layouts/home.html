---
layout: default
---

<div class="site-container">
  <!-- Hero Section -->
  {% include hero.html %}

  <!-- Latest Articles Section -->
  <section class="latest-posts-section">
    <div class="section-header">
      <div>
        <h2 class="section-title">Latest Articles</h2>
        <p style="font-size: 0.925rem; color: var(--text-muted); margin-top: 0.25rem;">
          {{ site.tagline }}
        </p>
      </div>
      <a href="{{ '/archive/' | relative_url }}" class="section-link">
        View all articles
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

    <div class="posts-grid">
      {% assign posts_limit = site.theme_settings.posts_per_page | default: 6 %}
      {% for post in site.posts limit: posts_limit %}
        {% include post-card.html post=post %}
      {% endfor %}
    </div>
  </section>
</div>
