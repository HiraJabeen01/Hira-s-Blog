---
layout: default
---

<div class="content-container">
  <header style="margin-bottom: 2rem;">
    <h1 style="font-size: 2.25rem; font-weight: 800; letter-spacing: -0.025em; color: var(--text-primary); margin-bottom: 0.5rem;">
      {{ page.title }}
    </h1>
    {% if page.description %}
    <p style="font-size: 1.1rem; color: var(--text-secondary);">
      {{ page.description }}
    </p>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</div>
