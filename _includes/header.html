<header class="site-header">
  <div class="site-container">
    <div class="header-inner">
      <!-- Brand Logo / Title -->
      <a href="{{ '/' | relative_url }}" class="brand" aria-label="{{ site.title }}">
        <span class="brand-icon">{{ site.title | slice: 0, 1 | default: "O" }}</span>
        <span>{{ site.title }}</span>
      </a>

      <!-- Navigation & Actions -->
      <div class="nav-group">
        <nav class="site-nav" aria-label="Main Navigation">
          <ul class="nav-links">
            {% for item in site.navigation %}
            <li>
              <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
                {{ item.title }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </nav>

        <div class="header-actions">
          {% include theme-toggle.html %}

          {% if site.author.github %}
          <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="GitHub Profile" title="GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</header>
