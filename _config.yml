# ==============================================================================
#  OPENBLOG CONFIGURATION FILE
#  Welcome! You only need to edit this file to personalize your entire blog.
#  All changes take effect automatically when you commit your edits.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BLOG IDENTITY
# ------------------------------------------------------------------------------
title: "Hira's Blog"
tagline: "Exploring Forward Deployed Engineering, Software Systems, and Intelligent Automation."
description: "Articles and engineering perspectives on Forward Deployed Engineering (FDE), software systems architecture, and intelligent automation by Hira Jabeen."

# Your website URL:
# If your repo is named "my-blog" and your username is "johndoe", set:
#   url: "https://johndoe.github.io"
#   baseurl: "/my-blog"
# If this is your user page (repo named "johndoe.github.io"), set:
#   url: "https://johndoe.github.io"
#   baseurl: ""
# If you use a custom domain (e.g. blog.yourname.com), set:
#   url: "https://blog.yourname.com"
#   baseurl: ""
url: "https://hirajabeen01.github.io"
baseurl: "/Hira-s-Blog"

# ------------------------------------------------------------------------------
# 2. AUTHOR INFORMATION
# ------------------------------------------------------------------------------
author:
  name: "Hira Jabeen"
  bio: "Practice Lead specializing in Forward Deployed Engineering, distributed systems, and intelligent automation."
  avatar: "/assets/images/hira-jabeen.jpg" # Put your photo in assets/images/ or link to an image
  github: "HiraJabeen01"
  # twitter: "yourusername"
  # linkedin: "yourusername"
  # email: "you@example.com"

# ------------------------------------------------------------------------------
# 3. APPEARANCE & THEME SETTINGS
# ------------------------------------------------------------------------------
theme_settings:
  # Choose default color mode: "system" (follows device), "dark", or "light"
  default_theme: "system"

  # Choose your accent color: "indigo", "blue", "violet", "emerald", "rose", "amber"
  accent_color: "indigo"

  # Show featured post hero section on the homepage? (true or false)
  show_hero: true

  # Display estimated reading time on article cards? (true or false)
  show_reading_time: true

  # Show author card at the end of each blog post? (true or false)
  show_author_box: true

  # Number of recent posts shown on homepage
  posts_per_page: 9

# ------------------------------------------------------------------------------
# 4. NAVIGATION LINKS (Top Header)
# ------------------------------------------------------------------------------
navigation:
  - title: "Home"
    url: "/"
  - title: "Articles"
    url: "/archive/"
  - title: "About"
    url: "/about/"

# ------------------------------------------------------------------------------
# 5. FOOTER & SOCIAL LINKS
# ------------------------------------------------------------------------------
footer:
  copyright_text: "Built with OpenBlog. Free & open source."
  show_rss: true

# ------------------------------------------------------------------------------
# 6. JEKYLL BUILD SETTINGS (Standard GitHub Pages settings)
# ------------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
